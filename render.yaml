databases:
  - name: flux-budget-db
    databaseName: fluxbudget
    user: fluxuser
    plan: free

services:
  - type: web
    name: flux-budget-app
    env: docker
    plan: free
    envVars:
      - key: PORT
        value: "80"
      - key: APP_NAME
        value: "Flux Budget App"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: flux-budget-db
          property: connectionString
      - key: APP_URL
        value: https://flux-budget-app.onrender.com 
      - key: APP_KEY
        sync: false